<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STRATA</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <meta name="theme-color" content="#0c0d10" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0d10;
    }

    a {
      display: block;
      line-height: 0;
      transition: opacity 0.15s ease;
    }

    a:hover {
      opacity: 0.88;
    }

    img {
      display: block;
      width: min(480px, 85vw);
      height: auto;
    }
  </style>
</head>
<body>
  <a href="https://github.com/nrek/cxl-strata" title="STRATA on GitHub">
    <img src="/assets/strata_large.png" alt="STRATA" width="480" height="480" />
  </a>
</body>
</html>
