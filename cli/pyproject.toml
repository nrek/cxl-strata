[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cxl-strata"
version = "0.3.0"
description = "STRATA - shared project memory CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "rich>=13.0.0",
]

[project.scripts]
strata = "cxl_strata.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cxl_strata*"]

[tool.setuptools.package-data]
cxl_strata = ["workspace_index/schema.sql", "static/*", "rules/*.mdc", "skills/strata/SKILL.md"]
